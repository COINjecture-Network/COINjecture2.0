name: CI

on:
  push:
    branches: [main, remove-libp2p]
  pull_request:
    branches: [main, remove-libp2p]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Used both in shell guards and passed to dtolnay/rust-toolchain with a fallback so it can never be empty.
  # PINNED — must stay identical to [toolchain].channel in rust-toolchain.toml; every job's Guard step
  # asserts they match and rejects a floating channel (D11). Bump both together, in one PR.
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  # ─── Stage 1: Lint ──────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Guard — toolchain is set, pinned, and agrees with rust-toolchain.toml
        shell: bash
        run: |
          set -euo pipefail
          : "${RUST_TOOLCHAIN:?RUST_TOOLCHAIN must be set}"
          pinned="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          : "${pinned:?could not read [toolchain].channel from rust-toolchain.toml}"
          if [ "$pinned" != "$RUST_TOOLCHAIN" ]; then
            echo "::error::Toolchain drift — rust-toolchain.toml pins '$pinned' but RUST_TOOLCHAIN is '$RUST_TOOLCHAIN'. These must match (D11: one source of truth)."
            exit 1
          fi
          case "$pinned" in
            stable|beta|nightly*)
              echo "::error::Toolchain channel '$pinned' is floating. A floating channel lets an upstream lint release red this pipeline with zero code changes, which silently disables the Security Audit job (needs: lint). Pin an explicit version (D11)."
              exit 1
              ;;
          esac
          echo "Toolchain pinned and consistent: $pinned"

      - name: Install Rust toolchain (pinned + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN || 'stable' }}
          components: rustfmt, clippy

      - name: Verify Rust toolchain
        run: |
          set -euxo pipefail
          command -v rustc
          rustc -V
          cargo -V
          rustup show active-toolchain || true

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ─── Stage 2: Test ──────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        feature_set: [default, adzdb]
    steps:
      - uses: actions/checkout@v6

      - name: Guard — toolchain is set, pinned, and agrees with rust-toolchain.toml
        shell: bash
        run: |
          set -euo pipefail
          : "${RUST_TOOLCHAIN:?RUST_TOOLCHAIN must be set}"
          pinned="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          : "${pinned:?could not read [toolchain].channel from rust-toolchain.toml}"
          if [ "$pinned" != "$RUST_TOOLCHAIN" ]; then
            echo "::error::Toolchain drift — rust-toolchain.toml pins '$pinned' but RUST_TOOLCHAIN is '$RUST_TOOLCHAIN'. These must match (D11: one source of truth)."
            exit 1
          fi
          case "$pinned" in
            stable|beta|nightly*)
              echo "::error::Toolchain channel '$pinned' is floating. A floating channel lets an upstream lint release red this pipeline with zero code changes, which silently disables the Security Audit job (needs: lint). Pin an explicit version (D11)."
              exit 1
              ;;
          esac
          echo "Toolchain pinned and consistent: $pinned"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN || 'stable' }}

      - name: Verify Rust toolchain
        run: |
          set -euxo pipefail
          rustc -V
          cargo -V

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache build artifacts
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: |
          if [[ "${{ matrix.feature_set }}" == "adzdb" ]]; then
            cargo test --all --features adzdb
          else
            cargo test --all
          fi

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Code coverage
        run: |
          cargo tarpaulin \
            --all \
            --timeout 120 \
            --out Xml \
            --output-dir coverage/
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        if: always()
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false

  # ─── Stage 3: Build ─────────────────────────────────────────────────────────
  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        feature_set: [default, adzdb]
    steps:
      - uses: actions/checkout@v6

      - name: Guard — toolchain is set, pinned, and agrees with rust-toolchain.toml
        shell: bash
        run: |
          set -euo pipefail
          : "${RUST_TOOLCHAIN:?RUST_TOOLCHAIN must be set}"
          pinned="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          : "${pinned:?could not read [toolchain].channel from rust-toolchain.toml}"
          if [ "$pinned" != "$RUST_TOOLCHAIN" ]; then
            echo "::error::Toolchain drift — rust-toolchain.toml pins '$pinned' but RUST_TOOLCHAIN is '$RUST_TOOLCHAIN'. These must match (D11: one source of truth)."
            exit 1
          fi
          case "$pinned" in
            stable|beta|nightly*)
              echo "::error::Toolchain channel '$pinned' is floating. A floating channel lets an upstream lint release red this pipeline with zero code changes, which silently disables the Security Audit job (needs: lint). Pin an explicit version (D11)."
              exit 1
              ;;
          esac
          echo "Toolchain pinned and consistent: $pinned"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN || 'stable' }}

      - name: Verify Rust toolchain
        run: |
          set -euxo pipefail
          rustc -V
          cargo -V

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache build artifacts
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build release binaries
        run: |
          if [[ "${{ matrix.feature_set }}" == "adzdb" ]]; then
            cargo build --release --features adzdb --bin coinject
          else
            cargo build --release --bin coinject
          fi
          cargo build --release --bin coinject-wallet

      - name: Upload node binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: coinject-node-linux-amd64
          path: target/release/coinject
          retention-days: 7

      - name: Upload wallet binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: coinject-wallet-linux-amd64
          path: target/release/coinject-wallet
          retention-days: 7

  # ─── Stage 4: Security Audit ────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Guard — toolchain is set, pinned, and agrees with rust-toolchain.toml
        shell: bash
        run: |
          set -euo pipefail
          : "${RUST_TOOLCHAIN:?RUST_TOOLCHAIN must be set}"
          pinned="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          : "${pinned:?could not read [toolchain].channel from rust-toolchain.toml}"
          if [ "$pinned" != "$RUST_TOOLCHAIN" ]; then
            echo "::error::Toolchain drift — rust-toolchain.toml pins '$pinned' but RUST_TOOLCHAIN is '$RUST_TOOLCHAIN'. These must match (D11: one source of truth)."
            exit 1
          fi
          case "$pinned" in
            stable|beta|nightly*)
              echo "::error::Toolchain channel '$pinned' is floating. A floating channel lets an upstream lint release red this pipeline with zero code changes, which silently disables the Security Audit job (needs: lint). Pin an explicit version (D11)."
              exit 1
              ;;
          esac
          echo "Toolchain pinned and consistent: $pinned"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN || 'stable' }}

      - name: Verify Rust toolchain
        run: |
          set -euxo pipefail
          rustc -V
          cargo -V

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-audit
        run: cargo audit

      - name: Run cargo-deny (licenses, bans, advisories)
        run: cargo deny check
        continue-on-error: true

  # ─── Stage 5: Docker Build ───────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, build]
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
