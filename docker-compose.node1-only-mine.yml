# Overlay for the **canonical** host: `--mine` on `node1` only; bootnode is P2P seed + light RPC.
# Keeps public :707 on the bootnode while `chain_getMiningWork` is served from node1 without wedging
# bootnode JSON-RPC during long `mine_block` write locks.
#
# Usage on the canonical VPS (e.g. 193):
#   docker compose -f docker-compose.yml -f docker-compose.node1-only-mine.yml up -d --no-build
#
# Set API `NODE_RPC_URL=http://bootnode:9933,http://node1:9933` (bootnode first for fast chain_getInfo;
# mining work fails over to node1).

services:
  bootnode:
    command: >
      --data-dir /data
      --chain-id coinject-network-b-v3
      --cpp-p2p-addr 0.0.0.0:707
      --metrics-addr 0.0.0.0:9090
      --rpc-addr 0.0.0.0:9933

  node1:
    command: >
      --mine
      --data-dir /data
      --chain-id coinject-network-b-v3
      --cpp-p2p-addr 0.0.0.0:707
      --metrics-addr 0.0.0.0:9090
      --rpc-addr 0.0.0.0:9933
      --bootnodes bootnode:707

  node2:
    command: >
      --data-dir /data
      --chain-id coinject-network-b-v3
      --cpp-p2p-addr 0.0.0.0:707
      --metrics-addr 0.0.0.0:9090
      --rpc-addr 0.0.0.0:9933
      --bootnodes bootnode:707

  node3:
    command: >
      --data-dir /data
      --chain-id coinject-network-b-v3
      --cpp-p2p-addr 0.0.0.0:707
      --metrics-addr 0.0.0.0:9090
      --rpc-addr 0.0.0.0:9933
      --bootnodes bootnode:707
