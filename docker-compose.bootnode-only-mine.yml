# Overlay for the **canonical** host: keep `--mine` on `bootnode` only; `node1`–`node3` are full
# peers/RPC replicas without competing for block production.
#
# Usage on the bootnode VPS (e.g. 193):
#   docker compose -f docker-compose.yml -f docker-compose.bootnode-external-chain.yml \
#     -f docker-compose.bootnode-only-mine.yml up -d --no-build
#
# Follower VPSs should use `docker-compose.follower-no-mine.yml` instead (no mining on any service).

services:
  node1:
    command: >
      --data-dir /data
      --chain-id coinject-network-b-v4
      --cpp-p2p-addr 0.0.0.0:707
      --metrics-addr 0.0.0.0:9090
      --rpc-addr 0.0.0.0:9933
      --bootnodes bootnode:707

  node2:
    command: >
      --data-dir /data
      --chain-id coinject-network-b-v4
      --cpp-p2p-addr 0.0.0.0:707
      --metrics-addr 0.0.0.0:9090
      --rpc-addr 0.0.0.0:9933
      --bootnodes bootnode:707

  node3:
    command: >
      --data-dir /data
      --chain-id coinject-network-b-v4
      --cpp-p2p-addr 0.0.0.0:707
      --metrics-addr 0.0.0.0:9090
      --rpc-addr 0.0.0.0:9933
      --bootnodes bootnode:707
